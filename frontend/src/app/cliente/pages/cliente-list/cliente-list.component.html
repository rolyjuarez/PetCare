
    <div class="space-y-6">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold dark:text-white">Clientes</h1>
        <button class="bg-primary-500 text-white px-4 py-2 rounded-lg hover:bg-primary-600 flex items-center gap-2">
          <span class="material-icons text-sm">add</span> Nuevo Cliente
        </button>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4">
        <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearch()"
               placeholder="Buscar cliente..."
               class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600" />
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50 dark:bg-gray-700">
            <tr>
              <th class="px-6 py-3 text-left text-sm font-medium dark:text-gray-300">Nombre</th>
              <th class="px-6 py-3 text-left text-sm font-medium dark:text-gray-300">CI</th>
              <th class="px-6 py-3 text-left text-sm font-medium dark:text-gray-300">Telefono</th>
              <th class="px-6 py-3 text-left text-sm font-medium dark:text-gray-300">Email</th>
              <th class="px-6 py-3 text-left text-sm font-medium dark:text-gray-300">Notas</th>
              <th class="px-6 py-3 text-left text-sm font-medium dark:text-gray-300">Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (item of items(); track item.id) {
              <tr class="border-t dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-750">
                <td class="px-6 py-4 dark:text-gray-300">{{ item.personaNombre }} {{ item.personaApellido }}</td>
                <td class="px-6 py-4 dark:text-gray-300">{{ item.personaCi }}</td>
                <td class="px-6 py-4 dark:text-gray-300">{{ item.personaTelefono }}</td>
                <td class="px-6 py-4 dark:text-gray-300">{{ item.personaEmail }}</td>
                <td class="px-6 py-4 dark:text-gray-300 text-sm">{{ item.notas }}</td>
                <td class="px-6 py-4">
                  <button class="text-primary-500 hover:underline mr-3">Editar</button>
                  <button class="text-red-500 hover:underline">Eliminar</button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="6" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">No hay clientes registrados</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
