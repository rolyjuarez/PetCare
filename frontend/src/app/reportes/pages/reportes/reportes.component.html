
    <div class="space-y-6">
      <h1 class="text-2xl font-bold dark:text-white">Reportes</h1>

      <!-- Report Selection -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4 dark:text-white">Generar Reporte</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tipo de Reporte</label>
            <select [(ngModel)]="selectedReport"
                    class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600">
              <option value="reservas">Reservas por Periodo</option>
              <option value="ingresos">Ingresos</option>
              <option value="clientes">Clientes Activos</option>
              <option value="proveedores">Desempeno Proveedores</option>
              <option value="servicios">Servicios Populares</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Fecha Inicio</label>
            <input type="date" [(ngModel)]="fechaInicio"
                   class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Fecha Fin</label>
            <input type="date" [(ngModel)]="fechaFin"
                   class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600" />
          </div>
        </div>
        <button (click)="generarReporte()"
                class="mt-4 bg-primary-500 text-white px-6 py-2 rounded-lg hover:bg-primary-600 flex items-center gap-2">
          <span class="material-icons text-sm">assessment</span> Generar Reporte
        </button>
      </div>

      <!-- Report Results -->
      @if (reportGenerated()) {
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold dark:text-white">{{ reportTitle() }}</h2>
            <button class="text-primary-500 hover:underline flex items-center gap-1">
              <span class="material-icons text-sm">download</span> Exportar PDF
            </button>
          </div>

          <!-- Summary Cards -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            @for (card of summaryCards(); track card.label) {
              <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ card.label }}</p>
                <p class="text-2xl font-bold mt-1 dark:text-white">{{ card.value }}</p>
              </div>
            }
          </div>

          <!-- Placeholder Chart Area -->
          <div class="bg-gray-50 dark:bg-gray-700 rounded-lg h-64 flex items-center justify-center">
            <div class="text-center text-gray-400">
              <span class="material-icons text-4xl">bar_chart</span>
              <p class="mt-2">Grafico del reporte</p>
            </div>
          </div>
        </div>
      }
    </div>
