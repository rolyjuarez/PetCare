<div class="space-y-6 max-w-4xl mx-auto">

  <!-- Seccion: Informacion Personal -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
    <h2 class="text-xl font-bold dark:text-white mb-6 flex items-center gap-2">
      <span class="material-icons text-primary-500">person</span> Informacion Personal
    </h2>

    @if (loadingProfile()) {
      <div class="flex items-center justify-center py-8">
        <div class="w-6 h-6 border-2 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
        <span class="ml-3 text-gray-500 dark:text-gray-400">Cargando perfil...</span>
      </div>
    } @else {
      <form (ngSubmit)="saveProfile()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Nombre *</label>
            <input type="text" [(ngModel)]="profileForm.nombre" name="nombre" required
                   class="w-full p-2 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Primer Apellido *</label>
            <input type="text" [(ngModel)]="profileForm.primerApellido" name="primerApellido" required
                   class="w-full p-2 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Segundo Apellido</label>
            <input type="text" [(ngModel)]="profileForm.segundoApellido" name="segundoApellido"
                   class="w-full p-2 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">CI</label>
            <input type="text" [(ngModel)]="profileForm.ci" name="ci" readonly
                   class="w-full p-2 border rounded-lg text-sm bg-gray-100 dark:bg-gray-600 dark:text-gray-400 dark:border-gray-600 cursor-not-allowed" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Email *</label>
            <input type="email" [(ngModel)]="profileForm.email" name="email" required
                   class="w-full p-2 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Telefono</label>
            <input type="text" [(ngModel)]="profileForm.telefono" name="telefono"
                   class="w-full p-2 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent" />
          </div>
        </div>

        <div class="flex justify-end pt-4 border-t dark:border-gray-700">
          <button type="submit" [disabled]="savingProfile()"
                  class="px-6 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 disabled:opacity-50 flex items-center gap-2">
            @if (savingProfile()) {
              <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Guardando...
            } @else {
              <span class="material-icons text-sm">save</span> Guardar Cambios
            }
          </button>
        </div>
      </form>
    }
  </div>

  <!-- Seccion: Cambiar Contrasena -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
    <h2 class="text-xl font-bold dark:text-white mb-6 flex items-center gap-2">
      <span class="material-icons text-primary-500">lock</span> Cambiar Contrasena
    </h2>

    <form (ngSubmit)="changePassword()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Contrasena Actual *</label>
          <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="passwordForm.oldPassword" name="oldPassword" required
                   class="w-full p-2 pr-10 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                   placeholder="Ingrese contrasena actual" />
            <button type="button" (click)="showPassword.set(!showPassword())"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <span class="material-icons text-lg">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Nueva Contrasena *</label>
          <div class="relative">
            <input [type]="showNewPassword() ? 'text' : 'password'" [(ngModel)]="passwordForm.newPassword" name="newPassword" required
                   class="w-full p-2 pr-10 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                   placeholder="Ingrese nueva contrasena" />
            <button type="button" (click)="showNewPassword.set(!showNewPassword())"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <span class="material-icons text-lg">{{ showNewPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Confirmar Nueva Contrasena *</label>
          <div class="relative">
            <input [type]="showConfirmPassword() ? 'text' : 'password'" [(ngModel)]="passwordForm.confirmPassword" name="confirmPassword" required
                   class="w-full p-2 pr-10 border rounded-lg text-sm dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                   placeholder="Confirme nueva contrasena" />
            <button type="button" (click)="showConfirmPassword.set(!showConfirmPassword())"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <span class="material-icons text-lg">{{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
      </div>

      <div class="flex justify-end pt-4 border-t dark:border-gray-700">
        <button type="submit" [disabled]="changingPassword()"
                class="px-6 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 disabled:opacity-50 flex items-center gap-2">
          @if (changingPassword()) {
            <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Cambiando...
          } @else {
            <span class="material-icons text-sm">lock_reset</span> Cambiar Contrasena
          }
        </button>
      </div>
    </form>
  </div>

</div>
