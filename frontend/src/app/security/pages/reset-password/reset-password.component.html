<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="paw-circle">🐾</div>
      <h2>Restablecer Contrasena</h2>
      <p>Ingrese su nueva contrasena</p>
    </div>

    <div class="card-body">
      @if (error()) {
        <div class="alert alert-error">
          <span class="material-icons" style="font-size:1.1rem">error_outline</span>
          {{ error() }}
        </div>
      }

      @if (success()) {
        <div class="alert alert-success">
          <span class="material-icons" style="font-size:1.1rem">check_circle</span>
          Contrasena restablecida exitosamente. Sera redirigido al login.
        </div>
      } @else {
        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Nueva Contrasena</label>
            <div class="input-wrapper">
              <input [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword" placeholder="Minimo 6 caracteres" required />
              <button type="button" class="toggle-password" (click)="showNewPassword = !showNewPassword">
                <span class="material-icons">{{ showNewPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirmar Contrasena</label>
            <div class="input-wrapper">
              <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repita su contrasena" required />
              <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">
                <span class="material-icons">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>
          <button type="submit" class="btn" [disabled]="loading() || !token">
            @if (loading()) {
              <div class="spinner"></div> Restableciendo...
            } @else {
              <span class="material-icons" style="font-size:1.1rem">lock_reset</span> Restablecer Contrasena
            }
          </button>
        </form>
      }
    </div>

    <div class="back-link">
      <a (click)="goToLogin()">← Volver al inicio de sesion</a>
    </div>
  </div>
</div>
