server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: reservation-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/petcaredb
    username: postgres
    password: 123qwe
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: America/La_Paz
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:roly.juarez@gmail.com}
    password: ${MAIL_PASSWORD:srek cder xteq iqnj}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: bo.capital.tec.pet.modules.reserva.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:PETCareSecretKeyForJWTTokenGeneration2024VeryLongAndSecureKeyMustBe256Bits}
  expiration: 3600000
  refresh-expiration: 604800000

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:true}
    from: ${MAIL_FROM:roly.juarez@gmail.com}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    group-id: reservation-service
    topic:
      reserva-creada: reserva.creada
      reserva-confirmada: reserva.confirmada
      reserva-cancelada: reserva.cancelada
      comando-confirmar-reserva: saga.comando.confirmar-reserva
      comando-rechazar-reserva: saga.comando.rechazar-reserva
      comando-cancelar-reserva: saga.comando.cancelar-reserva
      dlt: saga.dlt.v1
    partitions: 3
    replication-factor: 1
    retention-ms: 604800000

logging:
  level:
    bo.capital.tec.pet: DEBUG
    org.springframework.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
