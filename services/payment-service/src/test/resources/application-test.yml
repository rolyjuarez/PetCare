spring:
  datasource:
    url: jdbc:h2:mem:petcare;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    group-id: payment-service-test
    topic:
      reserva-creada: test.reserva.creada
      reserva-aceptada: test.reserva.aceptada
      reserva-rechazada: test.reserva.rechazada
      reserva-confirmada: test.reserva.confirmada
      pago-completado: test.pago.completado
      pago-fallido: test.pago.fallido
      pago-reembolsado: test.pago.reembolsado
      dlt: test.reserva.dlt
  pasarela:
    prefijo-referencia: PTC-TEST

jwt:
  secret: PETCareSecretKeyForJWTTokenGeneration2024VeryLongAndSecureKeyMustBe256Bits
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    bo.capital.tec.pet: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
