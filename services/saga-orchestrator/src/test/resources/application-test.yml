spring:
  datasource:
    url: jdbc:h2:mem:saga;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    group-id: saga-orchestrator-test
    topic:
      reserva-creada: test.reserva.creada
      reserva-aceptada: test.reserva.aceptada
      reserva-rechazada: test.reserva.rechazada
      reserva-confirmada: test.reserva.confirmada
      reserva-cancelada: test.reserva.cancelada
      pago-completado: test.pago.completado
      pago-fallido: test.pago.fallido
      pago-reembolsado: test.pago.reembolsado
      comando-notificar-proveedor: test.saga.comando.notificar-proveedor
      comando-confirmar-reserva: test.saga.comando.confirmar-reserva
      comando-crear-pago: test.saga.comando.crear-pago
      comando-cancelar-reserva: test.saga.comando.cancelar-reserva
      comando-rechazar-reserva: test.saga.comando.rechazar-reserva
      comando-liberar-descuento: test.saga.comando.liberar-descuento
      dlt: test.saga.dlt
    partitions: 3
    replication-factor: 1
    retention-ms: 604800000

logging:
  level:
    bo.capital.tec.pet: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
